[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diffgenome"
version = "0.0.1"
description = "Reconstruct system-level behavioral paths by stitching isolated unit-test executions across internal mock boundaries."
readme = "README.md"
# 3.12+ is required: the tracer is built on sys.monitoring (PEP 669).
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/diffgenome"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".diffgenome"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
