[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diffgenome"
version = "0.1.8"
description = "Runtime evidence for code changes: run a repository's existing tests against a change and report what actually executed."
readme = "README.md"
# 3.12+ is required: the Python tracer is built on sys.monitoring (PEP 669).
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
authors = [{ name = "karims" }]
keywords = ["code review", "runtime evidence", "test mapping", "tracing", "change impact"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.optional-dependencies]
# The Behavioral Genome (model-proposed, test-checked behavioral rules; `diffgenome genome`) is
# research code and optional: nothing in `diffgenome change` or the runtime-evidence contract
# imports it. It needs no extra packages (an OpenAI key only for live proposals); the extra
# exists to state that intent.
genome = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/diffgenome"]
# the Go and Node collectors ship as package data; their node_modules never do
exclude = ["src/diffgenome/_collectors/node/node_modules"]

[tool.hatch.build.targets.sdist]
include = ["/src/diffgenome", "/tests", "/fixtures", "/README.md", "/LICENSE", "/pyproject.toml"]
exclude = ["src/diffgenome/_collectors/node/node_modules", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".diffgenome", "docs/runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[project.scripts]
diffgenome = "diffgenome.__main__:main"
